<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Copilot in Chrome (unofficial)</title>
    <script type="module" src="/src/sidepanel/index.ts"></script>
  </head>
  <body>
    <main>
      <div id="chat-actions" class="chat-actions" hidden>
        <button id="new-chat" class="quiet" type="button" hidden disabled>New chat</button>
        <button id="sign-out" class="quiet" type="button" disabled>Sign out</button>
      </div>

      <div class="notice">
        <p id="status" class="status" role="status"></p>
        <p id="error" class="error" role="alert" hidden></p>
        <button id="try-again" class="secondary" type="button" hidden>Try again</button>
      </div>

      <form id="auth-form" class="auth" hidden>
        <label for="pat">Copilot needs a fine-grained PAT with the Copilot Requests permission to sign in as you.</label>
        <div class="row">
          <input id="pat" type="password" placeholder="github_pat_…" autocomplete="off" spellcheck="false"
            autocapitalize="off" maxlength="511" disabled>
          <button id="connect" type="submit" disabled>Connect</button>
        </div>
      </form>

      <section id="chat" class="chat" aria-label="Chat" hidden>
        <div id="transcript" class="transcript" role="log" aria-label="Conversation" tabindex="0" hidden></div>
        <form id="prompt-form" class="composer">
          <textarea id="prompt" rows="3" placeholder="Ask Copilot" aria-label="Prompt" aria-describedby="prompt-limit"
            aria-keyshortcuts="Meta+Enter Control+Enter" disabled></textarea>
          <p id="prompt-limit" class="prompt-limit" hidden></p>
          <div class="row">
            <select id="model" aria-label="Model" disabled></select>
          </div>
          <div class="row">
            <button id="send" type="submit" disabled>Send</button>
            <button id="stop" class="secondary" type="button" hidden disabled>Stop</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
